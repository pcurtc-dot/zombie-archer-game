 const P={shoot:['triangle',600,200,.08,.15],hit:['square',180,60,.08,.1],head:['square',900,300,.1,.12],boom:['sawtooth',90,20,.25,.5],pick:['sine',500,1000,.1,.15],hurt:['sawtooth',200,80,.12,.2],jump:['sine',300,500,.05,.08],click:['square',1200,800,.05,.05]}[type];
 if(!P)return;o.type=P[0];o.frequency.setValueAtTime(P[1],t);o.frequency.exponentialRampToValueAtTime(P[2],t+P[4]);g.gain.setValueAtTime(P[3],t);g.gain.exponentialRampToValueAtTime(.001,t+P[4]);o.start(t);o.stop(t+P[4]);}
// ---------- input ----------

// ---------- themes ----------
const THEMES=[
 {name:'Abandoned Outskirts',sub:'Fog rolls over dead farmland. Learn to survive.',sky:['#3a4a5a','#8a8f86'],far:'#5d6b6e',mid:'#3f4a44',near:'#25302a',ground:'#2c2a1f',grass:'#4a5a32',fog:'rgba(200,210,205,',light:.45,amb:'ash',mech:'Tutorial: fog farmland'},
 {name:'Industrial Graveyard',sub:'Conveyors still grind. Floors give way. Sprinters hunt.',sky:['#2a2230','#7a5a48'],far:'#4a3f44',mid:'#33292c',near:'#1c1718',ground:'#2a2626',grass:'#5a4a3a',fog:'rgba(160,130,110,',light:.55,amb:'sparks',mech:'Conveyors & collapsing platforms'},
 {name:'Underground Catacombs',sub:'Ricochet arrows off iron plates to hit switches. Beware spores.',sky:['#0c0b10','#1d1a1e'],far:'#1f1c22',mid:'#16141a',near:'#0d0c10',ground:'#24201c',grass:'#3a332a',fog:'rgba(120,160,110,',light:.82,amb:'dust',mech:'Ricochet switches & doors'},
 {name:'Burning City Ruins',sub:'The city burns. Barrels explode. Armored mutants march.',sky:['#2a0a08','#b84a1a'],far:'#4a1a12',mid:'#2a0f0c',near:'#140806',ground:'#221510',grass:'#3a2015',fog:'rgba(90,60,50,',light:.5,amb:'embers',mech:'Fire hazards & explosive barrels'},
 {name:"Overlord's Fortress",sub:'End the Overlord. End the plague.',sky:['#100818','#4a1a3a'],far:'#2a1830',mid:'#1c1022',near:'#0e0812',ground:'#1e1620',grass:'#3a2238',fog:'rgba(140,80,150,',light:.65,amb:'embers',mech:'Multi-phase boss'},
 {name:'Survival Mode',sub:'Endless waves. How long can you last?',sky:['#1a1020','#6a3030'],far:'#3a2030',mid:'#251520',near:'#120a10',ground:'#201818',grass:'#3a2a2a',fog:'rgba(150,100,100,',light:.55,amb:'ash',mech:'Endless'}];
// ---------- game state ----------

const up={draw:0,dmg:0,hp:0,sta:0};
let P,arrows,zombies,parts,plats,walls,switches,doors,fires,barrels,pickups,spawns,hazProj,clouds,boss,levelW,exitX,decor,tutorial;
const AT=[{n:'Normal',c:'#e8e0c8'},{n:'Fire',c:'#ff7a20'},{n:'Ice',c:'#7ad8ff'},{n:'Explosive',c:'#ffd040'}];

 if(n===0){levelW=4200;exitX=4000;

  plats.push({x:1200,y:360,w:160,h:16},{x:1900,y:340,w:180,h:16},{x:2700,y:370,w:140,h:16});
  sp(800,'walker');sp(1300,'walker',2,90);sp(1800,'walker',3,80);sp(2400,'walker',3,70);sp(2900,'sprinter');sp(3300,'walker',4,60);
  pickups.push({x:1600,y:GY-20,t:1,n:4},{x:2600,y:GY-20,t:2,n:4},{x:3100,y:GY-20,t:3,n:2},{x:2000,y:320,t:'hp'});
  for(let i=0;i<14;i++)decor.push({k:r()<.5?'fence':'hay',x:r()*levelW});
 }else if(n===1){levelW=4800;exitX=4600;
  plats.push({x:600,y:GY-16,w:400,h:16,conv:-140},{x:1500,y:GY-16,w:500,h:16,conv:160},{x:3300,y:GY-16,w:400,h:16,conv:-180});
  plats.push({x:1150,y:350,w:120,h:16,col:1},{x:1300,y:300,w:120,h:16,col:1},{x:2300,y:340,w:140,h:16,col:1},{x:2500,y:290,w:140,h:16,col:1},{x:2700,y:340,w:140,h:16,col:1},{x:3900,y:330,w:160,h:16});
  sp(900,'walker',2,80);sp(1400,'sprinter',2,120);sp(2000,'walker',3,70);sp(2600,'sprinter',3,100);sp(3200,'walker',3,60);sp(3600,'sprinter',4,80);sp(4200,'armored');
  pickups.push({x:1320,y:280,t:3,n:2},{x:2510,y:270,t:1,n:5},{x:3000,y:GY-20,t:2,n:4},{x:3950,y:310,t:'hp'});
  for(let i=0;i<10;i++)decor.push({k:r()<.5?'pipe':'crate',x:r()*levelW});
 }else if(n===2){levelW=4600;exitX=4400;
  // ceiling corridors
  walls.push({x:0,y:0,w:levelW,h:230,ceil:1});
  // door 1 with switch high behind overhang; ricochet plate on floor-ish/ceiling
  walls.push({x:1200,y:230,w:30,h:110}); // overhang pillar top
  doors.push({x:1210,y:340,w:24,h:GY-340,open:0,id:0});
  switches.push({x:1300,y:250,r:10,hit:0,id:0});
  walls.push({x:1000,y:228,w:160,h:12,bounce:1});
  doors.push({x:2600,y:230,w:24,h:GY-230,open:0,id:1});
  switches.push({x:2440,y:246,r:10,hit:0,id:1});walls.push({x:2300,y:300,w:16,h:120,bounce:1});walls.push({x:2380,y:228,w:120,h:12});walls.push({x:2380,y:228,w:12,h:60});
  doors.push({x:3700,y:230,w:24,h:GY-230,open:0,id:2});
  switches.push({x:3780,y:420,r:10,hit:0,id:2});walls.push({x:3500,y:228,w:180,h:12,bounce:1});walls.push({x:3660,y:228,w:10,h:150});
  sp(700,'walker',2,90);sp(1100,'spore');sp(1700,'walker',3,70);sp(2100,'spore',2,150);sp(2900,'sprinter',2,100);sp(3300,'spore');sp(3900,'walker',3,60);sp(4100,'spore',2,120);
  pickups.push({x:900,y:GY-20,t:1,n:4},{x:2000,y:GY-20,t:3,n:2},{x:3000,y:GY-20,t:2,n:4},{x:3400,y:GY-20,t:'hp'});
  for(let i=0;i<16;i++)decor.push({k:r()<.5?'skull':'torch',x:r()*levelW});
  tutorial=[{x:700,t:'Iron plates (blue-lit) ricochet arrows — hit switches to open doors'}];
 }else if(n===3){levelW=5000;exitX=4800;
  [[700,120],[1500,160],[2400,100],[3200,200],[4100,140]].forEach(f=>fires.push({x:f[0],w:f[1]}));
  [600,1100,1400,1950,2300,2800,3300,3700,4300].forEach(x=>barrels.push({x,y:GY-34,w:26,h:34,hp:1}));
  plats.push({x:680,y:350,w:170,h:16},{x:1480,y:340,w:200,h:16},{x:2380,y:350,w:140,h:16},{x:3180,y:330,w:240,h:16},{x:4090,y:340,w:170,h:16});
  sp(900,'walker',3,70);sp(1300,'armored');sp(1800,'sprinter',2,90);sp(2200,'armored',2,140);sp(2700,'walker',4,60);sp(3100,'spore');sp(3500,'armored',2,120);sp(4000,'sprinter',3,80);sp(4500,'armored',2,100);
  pickups.push({x:1000,y:GY-20,t:3,n:3},{x:1580,y:320,t:1,n:5},{x:2600,y:GY-20,t:3,n:3},{x:3300,y:310,t:'hp'},{x:3900,y:GY-20,t:2,n:4});
  for(let i=0;i<12;i++)decor.push({k:'rubble',x:r()*levelW});
 }else if(n===4){levelW=1800;exitX=99999;
  plats.push({x:250,y:330,w:180,h:16},{x:1370,y:330,w:180,h:16},{x:800,y:260,w:200,h:16});
  boss={x:1400,y:GY-150,w:110,h:150,hp:1500,maxHp:1500,phase:1,t:0,atk:0,face:-1,vx:0,flash:0,state:'idle',st:0,dead:0};
  pickups.push({x:340,y:310,t:3,n:3},{x:1460,y:310,t:1,n:5});
 }else{levelW=1800;exitX=99999;waveN=0;waveT=2;
  plats.push({x:300,y:340,w:200,h:16},{x:1300,y:340,w:200,h:16},{x:800,y:270,w:200,h:16});}
 P=newPlayer();camX=0;
}
function mkZ(type,x){const d={walker:{w:28,h:60,hp:60,sp:45,dmg:12,c:'#5f7a4a'},sprinter:{w:24,h:56,hp:40,sp:170,dmg:10,c:'#8a6a50'},armored:{w:36,h:66,hp:160,sp:40,dmg:20,c:'#5a5560'},spore:{w:34,h:58,hp:80,sp:35,dmg:10,c:'#7a8a3a'},minion:{w:24,h:52,hp:35,sp:110,dmg:8,c:'#6a4a6a'}}[type];
 const m=1+(lvl===5?waveN*.08:lvl*.08);
 return{type,x,y:GY-d.h,w:d.w,h:d.h,hp:d.hp*m,maxHp:d.hp*m,sp:d.sp*rnd(.85,1.15),dmg:d.dmg,c:d.c,vx:0,vy:0,face:-1,slow:0,burn:0,t:rnd(0,9),atk:0,flash:0,on:true,sporeT:rnd(1,3),lunge:0};}
// ---------- particles ----------
function part(x,y,vx,vy,life,c,s,g,glow){parts.push({x,y,vx,vy,life,ml:life,c,s,g:g||0,glow});}
function blood(x,y,n,c){for(let i=0;i<n;i++)part(x,y,rnd(-200,200),rnd(-260,40),rnd(.4,.9),c||(Math.random()<.5?'#7a0a0a':'#4a0505'),rnd(2,4),900);}
function sparks(x,y,n){for(let i=0;i<n;i++)part(x,y,rnd(-300,300),rnd(-300,100),rnd(.2,.5),'#ffd070',rnd(1,2.5),600,1);}
function explode(x,y,R,dmg){snd('boom');shake=Math.max(shake,14);flash=.4;
 for(let i=0;i<50;i++){const a=rnd(0,6.28),s=rnd(50,420);part(x,y,Math.cos(a)*s,Math.sin(a)*s,rnd(.3,.9),['#ffdd66','#ff8a20','#ff4a10','#444'][i%4],rnd(3,7),200,1);}
 for(let i=0;i<14;i++)part(x,y,rnd(-60,60),rnd(-120,-20),rnd(1,2),'rgba(60,55,50,.6)',rnd(10,20),-20);
 zombies.forEach(z=>{const d=Math.hypot(z.x+z.w/2-x,z.y+z.h/2-y);if(d<R)damageZ(z,dmg*(1-d/R*.6),false,true,x);});
 if(boss&&!boss.dead){const d=Math.hypot(boss.x+boss.w/2-x,boss.y+boss.h/2-y);if(d<R+50)hurtBoss(dmg*.8);}
 barrels.forEach(b=>{if(b.hp>0&&Math.hypot(b.x+13-x,b.y+17-y)<R){b.hp=0;setTimeout(()=>explode(b.x+13,b.y+10,130,90),120);}});
 const pd=Math.hypot(P.x+11-x,P.y+28-y);if(pd<R*.8)hurtP(25*(1-pd/R),x);}
// ---------- combat ----------
function hurtP(d,sx){if(P.inv>0||state!=='play')return;P.hp-=d;P.inv=.7;shake=Math.max(shake,8);snd('hurt');blood(P.x+11,P.y+20,10);P.vx+=(P.x>sx?1:-1)*220;P.vy=-180;if(P.hp<=0){P.hp=0;state='over';save.best=Math.max(save.best,score);persist();}}
function damageZ(z,d,head,expl,sx,fromVx){if(z.hp<=0)return;
 if(z.type==='armored'&&!head&&!expl){const front=(fromVx>0&&z.face<0)||(fromVx<0&&z.face>0);if(front){d*=.1;sparks(z.x+(z.face>0?z.w:0),z.y+z.h/2,10);snd('click');}}
 z.hp-=d;z.flash=.1;blood(z.x+z.w/2,z.y+(head?8:z.h/2),head?14:6,z.type==='spore'?'#8ab030':null);
 if(z.hp<=0){score+=({walker:50,sprinter:70,armored:150,spore:100,minion:30})[z.type]*(head?2:1);blood(z.x+z.w/2,z.y+z.h/2,25);
  if(z.type==='spore')clouds.push({x:z.x+z.w/2,y:z.y+z.h/2,r:20,life:4});
  if(Math.random()<.18)pickups.push({x:z.x,y:z.y+z.h-20,t:Math.random()<.3?'hp':1+(Math.random()*3|0),n:2,vy:-200});}}
function hurtBoss(d){if(!boss||boss.dead)return;boss.hp-=d;boss.flash=.1;blood(boss.x+boss.w/2,boss.y+40,8,'#6a1a6a');
 const ph=boss.hp>1000?1:boss.hp>500?2:3;if(ph!==boss.phase){boss.phase=ph;addMsg('THE OVERLORD ENRAGES — PHASE '+ph,'#f6a');shake=20;boss.state='roar';boss.st=1.2;}
 if(boss.hp<=0){boss.dead=1;score+=5000;for(let i=0;i<6;i++)setTimeout(()=>explode(boss.x+rnd(0,boss.w),boss.y+rnd(0,boss.h),120,0),i*200);zombies.forEach(z=>z.hp=0);}}
function fire(){const ch=P.charge,t=P.type;if(t>0&&P.ammo[t]<=0){addMsg('No '+AT[t].n+' arrows!','#f88');P.type=0;return;}
 if(t>0)P.ammo[t]--;const ox=P.x+11,oy=P.y+18,a=Math.atan2(mouse.y-oy,mouse.x+camX-ox);const s=500+ch*900;
 arrows.push({x:ox,y:oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t,dmg:(18+ch*42)*(1+up.dmg*.2),trail:[],b:t===0?2:1,life:4,stuck:0});snd('shoot');P.cool=.15;}
function solids(){const s=[];plats.forEach(p=>{if(!p.gone)s.push(p);});walls.forEach(w=>s.push(w));doors.forEach(d=>{if(!d.open||d.h>4)s.push(d);});return s;}
function hit(a,r){return a.x<r.x+r.w&&a.x+a.w>r.x&&a.y<r.y+r.h&&a.y+a.h>r.y;}
function moveBody(b,dt,solid){b.x+=b.vx*dt;for(const r of solid){if(r.oneway||(!r.ceil&&!r.bounce&&r.h<=16&&!r.door&&!r.isDoor&&r.w>0&&r.h<=16))continue;if(hit(b,r)){if(b.vx>0)b.x=r.x-b.w;else if(b.vx<0)b.x=r.x+r.w;b.vx=0;}}
 b.vy+=G*dt;b.y+=b.vy*dt;b.on=false;b.plat=null;
 for(const r of solid){if(hit(b,r)){const thin=r.h<=16&&!r.ceil&&!r.bounce;if(b.vy>0&&(b.y+b.h-b.vy*dt<=r.y+4)){b.y=r.y-b.h;b.vy=0;b.on=true;b.plat=r;}else if(!thin){if(b.vy<0){b.y=r.y+r.h;b.vy=0;}}}}
 if(b.y+b.h>=GY){const inFire=false;b.y=GY-b.h;b.vy=0;b.on=true;}
 b.x=clamp(b.x,0,levelW-b.w);}
// ---------- update ----------
function update(dt){T+=dt;
 if(pressed.Escape||pressed.KeyP){if(state==='play')state='pause';else if(state==='pause')state='play';}
 if(state==='title'){if(pressed.Enter||pressed.Space||pressed.Mouse){if(save.unlocked&&mouse.y>360&&mouse.y<400&&pressed.Mouse){startLevel(5);}else{score=0;Object.keys(up).forEach(k=>up[k]=0);startLevel(0);}}if(pressed.KeyS&&save.unlocked){score=0;startLevel(5);}}
 else if(state==='intro'){introT-=dt;if(introT<=0||pressed.Enter||pressed.Mouse)state='play';ambient(dt);}
 else if(state==='play')play(dt);
 else if(state==='upgrade')upgradeInput();
 else if(state==='over'){if(pressed.KeyR||pressed.Enter){const s=score;startLevel(lvl);score=Math.max(0,Math.floor(s*.7));}if(pressed.KeyT){state='title';}}
 else if(state==='victory'){ambient(dt);if(pressed.Enter||pressed.KeyT)state='title';if(pressed.KeyS){startLevel(5);}}
 pressed={};}
function startLevel(n){buildLevel(n);state='intro';introT=3;msgs=[];}
function ambient(dt){const th=THEMES[lvl];if(Math.random()<dt*30){const x=camX+rnd(0,W);
 if(th.amb==='ash')part(x,-10,rnd(-20,20),rnd(20,50),6,'rgba(200,200,200,.5)',rnd(1,2.5),0);
 else if(th.amb==='embers')part(x,H+10-rnd(0,100),rnd(-30,30),rnd(-80,-30),4,'#ff8a30',rnd(1,2.5),-5,1);
 else if(th.amb==='sparks'&&Math.random()<.2)part(x,rnd(100,250),rnd(-100,100),rnd(-50,50),.6,'#ffcc60',1.5,800,1);
 else if(th.amb==='dust')part(x,rnd(240,GY),rnd(-8,8),rnd(-5,5),5,'rgba(160,150,120,.4)',1.5,0);}
 for(const p of parts){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.y>GY&&p.g>100){p.y=GY;p.vy*=-.2;p.vx*=.5;}}
 parts=parts.filter(p=>p.life>0);if(parts.length>1500)parts.splice(0,parts.length-1500);}
function play(dt){ambient(dt);const sol=solids();
 // player
 let mv=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);const sprint=(keys.ShiftLeft||keys.ShiftRight)&&P.sta>5&&mv;
 const spd=(sprint?290:190)*(P.charging?.55:1);P.vx=lerp(P.vx,mv*spd,Math.min(1,dt*12));if(sprint)P.sta-=30*dt;
 if((pressed.KeyW||pressed.Space||pressed.ArrowUp)&&P.on&&P.sta>=12){P.vy=-620;P.sta-=12;snd('jump');for(let i=0;i<6;i++)part(P.x+11,P.y+P.h,rnd(-60,60),rnd(-40,0),.4,'rgba(150,140,120,.6)',3,0);}
 if(P.plat&&P.plat.conv)P.x+=P.plat.conv*dt;
 if(!sprint&&!P.charging)P.sta=Math.min(P.maxSta,P.sta+22*dt);
 moveBody(P,dt,sol);P.face=mouse.x+camX>P.x+11?1:-1;P.anim+=Math.abs(P.vx)*dt*.05;P.inv-=dt;P.cool-=dt;
 for(let i=1;i<=4;i++)if(pressed['Digit'+i]){P.type=i-1;snd('click');}
 if(mouse.down&&P.cool<=0){P.charging=true;P.charge=Math.min(1,P.charge+dt*(1.1+up.draw*.35));if(P.charge>=1)P.sta-=8*dt;if(P.sta<=0){P.sta=0;P.charge*=.98;}}
 else if(P.charging){fire();P.charging=false;P.charge=0;}
 // collapsing / conveyors
